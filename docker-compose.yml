services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-side path; it overrides the host path from .env.
      GOOGLE_CREDENTIALS_FILE: /secrets/credentials.json
    # The host path comes from .env (compose substitutes it) and may be a bare
    # filename, hence the explicit bind form.
    volumes:
      - type: bind
        source: ${GOOGLE_CREDENTIALS_FILE}
        target: /secrets/credentials.json
        read_only: true
